[platformio]
default_envs = wokwi_sim

[env:wokwi_sim]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DHAL_BACKEND_WOKWI=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:target_hw]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DHAL_BACKEND_TARGET=1
